<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Eren Tolga Tekin. AI, computer vision, cybersecurity, real-time data.">
  <style>
    .serif { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; }
    .mono { font-family: 'Geist Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    
.role { opacity: 0; animation: show 12.0s infinite both; }
@keyframes show { 0% {opacity:0} 0.1% {opacity:1} 22% {opacity:1} 22.1% {opacity:0} 100% {opacity:0} }
.cursor { animation: blink 0.9s steps(1) infinite; }
@keyframes blink { 0%,50% {opacity:1} 50.1%,100% {opacity:0} }
.glow { animation: pulse 6s ease-in-out infinite; }
@keyframes pulse { 0%,100% {opacity:.35} 50% {opacity:.6} }
.r0 { animation-delay: 0.0s; } .c0 { animation: type0 12.0s infinite both; animation-delay: 0.0s; }@keyframes type0 { 0% {transform:translateX(0); animation-timing-function: steps(14, end)} 10% {transform:translateX(252px)} 100% {transform:translateX(252px)} }.r1 { animation-delay: 3.0s; } .c1 { animation: type1 12.0s infinite both; animation-delay: 3.0s; }@keyframes type1 { 0% {transform:translateX(0); animation-timing-function: steps(15, end)} 10% {transform:translateX(270px)} 100% {transform:translateX(270px)} }.r2 { animation-delay: 6.0s; } .c2 { animation: type2 12.0s infinite both; animation-delay: 6.0s; }@keyframes type2 { 0% {transform:translateX(0); animation-timing-function: steps(13, end)} 10% {transform:translateX(234px)} 100% {transform:translateX(234px)} }.r3 { animation-delay: 9.0s; } .c3 { animation: type3 12.0s infinite both; animation-delay: 9.0s; }@keyframes type3 { 0% {transform:translateX(0); animation-timing-function: steps(24, end)} 10% {transform:translateX(432px)} 100% {transform:translateX(432px)} }
    @media (prefers-reduced-motion: reduce) { .role, .cursor, .glow, [class^="c"] { animation: none !important; } .r0 { opacity: 1; } [class^="c"] rect:first-child { display: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="0.88" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#f0d999" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0d999" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#333a46"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#090b0e"/>
    <rect x="640" width="560" height="300" fill="url(#dots)" opacity="0.6"/>
    <rect class="glow" width="1200" height="300" fill="url(#g)"/>
    <rect x="80" y="70" width="48" height="3" fill="#f0d999"/>
    <text x="80" y="140" class="serif" font-size="64" font-weight="600" fill="#f4f6f8">Eren Tolga Tekin</text>
    <text x="80" y="212" class="mono" font-size="30" fill="#9aa3af">&gt;</text>
  <g class="role r0">
    <text x="116" y="212" class="mono" font-size="30" fill="#f0d999">AI engineering</text>
    <g class="c0">
      <rect x="114" y="182" width="292" height="40" fill="#090b0e"/>
      <rect class="cursor" x="116" y="186" width="14" height="32" fill="#f0d999"/>
    </g>
  </g>
  <g class="role r1">
    <text x="116" y="212" class="mono" font-size="30" fill="#f0d999">Computer vision</text>
    <g class="c1">
      <rect x="114" y="182" width="310" height="40" fill="#090b0e"/>
      <rect class="cursor" x="116" y="186" width="14" height="32" fill="#f0d999"/>
    </g>
  </g>
  <g class="role r2">
    <text x="116" y="212" class="mono" font-size="30" fill="#f0d999">Cybersecurity</text>
    <g class="c2">
      <rect x="114" y="182" width="274" height="40" fill="#090b0e"/>
      <rect class="cursor" x="116" y="186" width="14" height="32" fill="#f0d999"/>
    </g>
  </g>
  <g class="role r3">
    <text x="116" y="212" class="mono" font-size="30" fill="#f0d999">Real-time data pipelines</text>
    <g class="c3">
      <rect x="114" y="182" width="472" height="40" fill="#090b0e"/>
      <rect class="cursor" x="116" y="186" width="14" height="32" fill="#f0d999"/>
    </g>
  </g>
    <text x="80" y="262" class="mono" font-size="15" letter-spacing="2" fill="#9aa3af">ENGINEERING STUDENT · ISEP PARIS · 2027</text>
    <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#333a46" stroke-width="2"/>
  </g>
</svg>
